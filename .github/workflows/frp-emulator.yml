name: FRP Emulator Validation

on:
  push:
    paths:
      - "04-emulator/android-frp-emulator/**"
      - ".github/workflows/frp-emulator.yml"
  pull_request:
    paths:
      - "04-emulator/android-frp-emulator/**"
      - ".github/workflows/frp-emulator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-emulator/android-frp-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python cli.py scenario ci-001 LAB-FRP-AB12CD34 --out ci-result.json
      - run: python -c "import json; d=json.load(open('ci-result.json')); assert d['state']=='DEVICE_READY'; assert len(d['events'])==4"
      - run: python transition_matrix.py
      - run: python fault_injection.py
      - run: python resilience_matrix.py
      - run: python evidence.py
      - run: python audit.py
      - run: python validate_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: frp-emulator-evidence
          path: |
            04-emulator/android-frp-emulator/ci-result.json
            04-emulator/android-frp-emulator/evidence.json
            04-emulator/android-frp-emulator/audit.json
            04-emulator/android-frp-emulator/reproducibility-manifest.json
            04-emulator/android-frp-emulator/transition-matrix.json
            04-emulator/android-frp-emulator/fault-injection.json
            04-emulator/android-frp-emulator/resilience-matrix.json
